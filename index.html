<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>The Gooldbook🦄</title>

  <link rel="manifest" href="/Gooldbook/Manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="theGooldbook">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
  <link rel="stylesheet" href="styles.css?v=5">
  <script defer src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <script defer src="app.js?v=5"></script>
</head>
<body>

<div id="backToTop" onclick="window.scrollTo({top: 0, behavior: 'smooth'}); document.body.scrollTop = 0; document.documentElement.scrollTop = 0;">⬆️</div>

<div class="crop-modal" id="gifModal">
  <div style="background:#fff; border-radius:12px; width:100%; max-width:480px; max-height:80vh; display:flex; flex-direction:column; overflow:hidden;">
    <div style="padding:12px 16px; border-bottom:1px solid #eee; display:flex; align-items:center; gap:10px;">
      <input id="gifSearch" placeholder="Search GIFs..." style="flex:1; margin:0;" oninput="debouncedGifSearch(this.value)">
      <button class="btn btn-alt" onclick="closeGifPicker()">Cancel</button>
    </div>
    <div id="gifGrid" class="gif-grid"></div>
  </div>
</div>

<div class="crop-modal" id="cropModal">
  <div class="crop-workspace" id="cropWorkspaceContainer">
    <img id="cropTargetImage" src="">
  </div>
  
  <div class="filter-tray" id="filterTray">
    <div class="filter-option active" onclick="selectPostFilter('normal', this)">
      <div class="filter-preview-box" style="background-color: #555;"></div>Normal
    </div>
    <div class="filter-option" onclick="selectPostFilter('film1982', this)">
      <div class="filter-preview-box" style="background-color: #555; filter: sepia(0.5) contrast(1.05) brightness(1.0) saturate(1.2) hue-rotate(-4deg);"></div>1982 Film 🎞️
    </div>
    <div class="filter-option" onclick="selectPostFilter('cyberpunk', this)">
      <div class="filter-preview-box" style="background-color: #555; filter: hue-rotate(140deg) saturate(1.8) contrast(1.3) brightness(0.9);"></div>Cyberpunk 🤖
    </div>
    <div class="filter-option" onclick="selectPostFilter('vhs90s', this)">
      <div class="filter-preview-box" style="background-color: #555; filter: contrast(1.1) saturate(1.3) brightness(1.05);"></div>90s VHS 📼
    </div>
    <div class="filter-option" onclick="selectPostFilter('technopunk', this)">
      <div class="filter-preview-box" style="background-color: #111; border: 1px solid #ff00ff; filter: contrast(1.9) brightness(0.7) grayscale(1);"></div>Technopunk ⚡
    </div>
    <div class="filter-option" onclick="selectPostFilter('aiportrait', this)">
      <div class="filter-preview-box" style="background-color: #2c3e50; border: 1px dashed #3498db;"></div>AI Portrait 🧠
    </div>
  </div>

  <div style="display:flex; gap:10px; width:100%; max-width:420px;">
    <button class="btn btn-alt" style="flex:1;" onclick="closeCropModal()">Cancel</button>
    <button class="btn" id="applyCropBtn" style="flex:1; background:#2ecc71;" onclick="applyImageCropAndFilter()">Apply & Save ✨</button>
  </div>
</div>

<div class="notif-banner" id="notifBanner" onclick="dismissNotif()">
  <span id="notifText"></span>
</div>

<div class="refresh-pill" id="refreshPill" onclick="acceptNewPosts()">
  ✨ New posts available! Click to view
</div>

<div class="nav">
  <div class="nav-icon">🦄</div>
  theGooldbook
  <div class="nav-badge" id="navBadge"></div>
  <button class="nav-bell" id="navBell" style="display:none;" onclick="toggleMentionsPanel()" aria-label="Mentions">🔔<span class="nav-bell-badge" id="bellBadge"></span></button>
</div>

<div class="mentions-panel" id="mentionsPanel"></div>
<div class="mention-suggest" id="mentionSuggest"></div>

<div class="auth-screen" id="authScreen" style="display:none;"></div>

<div class="container" id="appMain" style="display:none;">
  <div class="sidebar">
    <div id="myProfileLink"></div>
    
    <div class="sidebar-card"><b>🔍 Search Feed</b><input id="searchBar" placeholder="Search posts & comments..." oninput="debouncedRender()"></div>
    <div id="streakLeaderboard"></div>
    <div id="trending"></div>
    <div id="leaderboard"></div>
    <div id="hashtags"></div>
    
  </div>

  <div class="main-feed">
    <div id="joinRequests"></div>
    <div id="filterStatus"></div>
    <div class="card" id="postComposer">
      <input id="user" type="hidden">
      <div class="posting-as" id="postingAs"></div>
      <textarea id="msg" rows="2" placeholder="What's on your mind?"></textarea>
      <div style="display:flex; gap:6px; margin-bottom:4px;">
        <input type="file" id="file" accept="image/*" onchange="initiateCropper(event)" style="display:none;">
        <button class="btn btn-alt" onclick="document.getElementById('file').click()">📷 Photo</button>
        <button class="btn btn-alt" onclick="openGifPicker()">GIF</button>
      </div>
      <div id="imagePreviewStrip" style="display:none; flex-wrap:wrap; gap:8px; margin:8px 0;"></div>
      <button id="addAnotherPhotoBtn" style="display:none;" onclick="document.getElementById('file').click()">+ Add another photo</button>
      <div style="display: flex; gap: 5px;">
        <button id="postBtn" class="btn" style="flex: 2;" onclick="upload()">Post Update</button>
        <button class="btn btn-alt" style="flex: 1;" onclick="loadFeed()">🔄</button>
      </div>
    </div>
    <div id="feed">Loading feed...</div>
    <button id="loadMore" class="btn btn-alt" style="width:100%; display:none; margin-bottom:20px;" onclick="postsToShow+=10; render()">Load More</button>
  </div>
</div>

</body>
</html>
